# Application Configuration
quarkus.application.name=ms-access
quarkus.application.version=1.0.0

# HTTP Configuration
quarkus.http.port=8001
quarkus.http.root-path=/api/v1
quarkus.http.cors=true
# DEV: allow all origins so Cloudflare tunnel and any local frontend can preflight
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,HEAD,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.exposed-headers=content-disposition,content-type,x-total-count
quarkus.http.cors.access-control-max-age=3600
quarkus.http.cors.access-control-allow-credentials=true

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:1100}/${DB_NAME:dbqk}?currentSchema=acc
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# Security Configuration (JWT commented for development)
# quarkus.smallrye-jwt.enabled=true
# mp.jwt.verify.publickey.location=classpath:/META-INF/resources/publicKey.pem
# mp.jwt.verify.issuer=https://kplian.com

# OpenAPI / Swagger Configuration
quarkus.smallrye-openapi.info-title=MS Access API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.path=/api-docs
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.kplian".level=DEBUG
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.console.json=false
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# Health & Metrics
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-metrics.enabled=true
quarkus.smallrye-metrics.path=/metrics

# i18n Configuration
quarkus.locales=en, es
quarkus.default-locale=es-ES

# Integration Configuration
# URL of the API Gateway for microservice-to-microservice communication
kplian.gateway.url=${GATEWAY_URL:http://localhost:8787}

# Flyway (Migrations)
quarkus.hibernate-orm.database.default-schema=acc
quarkus.flyway.schemas=acc
quarkus.flyway.create-schemas=true
quarkus.flyway.table=flyway_schema_history_acc
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.repair-at-start=true