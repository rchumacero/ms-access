name: CI/CD Multi-Environment Pipeline

on:
  push:
    branches:
      - develop    # Entorno de Test
      - main       # Entorno de Producción

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker (tags por rama)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    name: Deploy to Test
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # Selecciona el entorno de GitHub Secrets para Test
    environment: test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Crear Contexto de Docker
        run: |
          docker context create vps-remote --docker "host=ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PORT }}"
          docker context use vps-remote
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generar .env para TEST
        run: |
          cat <<EOF > .env
          CONTAINER_NAME=cont-kp-ms-access-test
          IMAGE_TAG=develop
          APP_PORT=${{ secrets.APP_PORT }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_INTERNAL_PORT=${{ secrets.APP_INTERNAL_PORT }}
          APP_EXTERNAL_PORT=${{ secrets.APP_EXTERNAL_PORT }}
          EOF

      - name: Desplegar en Ambiente Test
        run: |
          docker compose pull
          docker compose --env-file .env up -d --remove-orphans
          docker image prune -f

  deploy-prod:
    name: Deploy to Production
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Selecciona el entorno de GitHub Secrets para Producción
    environment: production

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Crear Contexto de Docker
        run: |
          docker context create vps-remote --docker "host=ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PORT }}"
          docker context use vps-remote
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generar .env para PRODUCCIÓN
        run: |
          cat <<EOF > .env
          CONTAINER_NAME=cont-kp-ms-access-prod
          IMAGE_TAG=latest
          APP_PORT=${{ secrets.APP_PORT }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_INTERNAL_PORT=${{ secrets.APP_INTERNAL_PORT }}
          APP_EXTERNAL_PORT=${{ secrets.APP_EXTERNAL_PORT }}
          EOF

      - name: Desplegar en Ambiente Producción
        run: |
          docker compose pull
          docker compose --env-file .env up -d --remove-orphans
          docker image prune -f