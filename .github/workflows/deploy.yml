name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-and-deploy:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código (incluye docker-compose.yml)
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 1. Compilar imagen localmente en el Runner
      - name: Construir imagen local para escaneo
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Escaneo DevSecOps con Trivy
      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 3. Publicar imagen a GHCR si pasa el escaneo
      - name: Publicar imagen en GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 4. Configurar SSH para conexión remota con Docker
      - name: Configurar llave SSH para Docker Context
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 5. Crear Contexto de Docker Remoto apuntando al VPS
      - name: Crear Contexto de Docker Remoto
        run: |
          docker context create vps-remote --docker "host=ssh://${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PORT }}"
          docker context use vps-remote

      # 6. Autenticar el Docker Daemon del VPS en GHCR
      - name: Autenticar VPS en GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 7. Ejecutar Deploy usando el docker-compose.yml del repositorio
      - name: Desplegar con Docker Compose Remoto
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
