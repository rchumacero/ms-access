version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: ms-access-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:dbqk}
      POSTGRES_USER: ${DB_USERNAME:postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:postgres}
    ports:
      - "${DB_PORT:1100}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
